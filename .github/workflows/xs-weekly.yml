# Rebuild the latest xScaler release when its base image or toolchain has fixable
# HIGH/CRITICAL findings and a rebuild would actually fix some of them.
#
# GitHub disables scheduled workflows after 60 days without repository activity. The upstream
# sync (A2) keeps the repository active, so this schedule keeps running.
#
# The rebuild is cut by dispatching xs-release.yml with the next tag and the commit. The release
# workflow creates the git tag only after the image is published and verified, so a failed
# release leaves no tag behind.
name: xs-weekly

on:
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: xs-weekly
  cancel-in-progress: false

env:
  GHCR_REPO: ghcr.io/xscaler/mimir

jobs:
  rescan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install crane, cosign and Trivy
        run: |
          set -euo pipefail
          . .github/scripts/xs-lib.sh
          xs_install_crane
          xs_install_cosign
          xs_install_trivy
      - name: Find the latest published release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          . .github/scripts/xs-lib.sh
          export LC_ALL=C
          # Release tags only: upstream pre-release versions never match this pattern.
          tags="$(git tag --list 'v*-xs.*' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-xs\.[0-9]+$' || [ $? -eq 1 ]; } | sort -V -r)"
          if [ -z "${tags}" ]; then
            echo "No v*-xs.* tag exists yet, nothing to rescan."
            echo "found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # The highest tag whose image exists in GHCR and is signed by the exact main release
          # identity. An image without a trusted signature is skipped, and the next lower tag is tried.
          identity="https://github.com/xscaler/mimir/.github/workflows/xs-release.yml@refs/heads/main"
          latest=""
          while read -r t; do
            rc=0
            digest="$(xs_tag_digest mimir "${GHCR_REPO}:${t#v}")" || rc=$?
            case "${rc}" in
              0) ;;
              1) echo "${t} has no image in GHCR, skipping."; continue ;;
              *) exit 1 ;;
            esac
            if cosign verify --certificate-identity "${identity}" --certificate-oidc-issuer "${XS_OIDC_ISSUER}" \
              "${GHCR_REPO}@${digest}" > /dev/null 2>&1; then
              latest="${t}"
              break
            fi
            echo "::warning::${t} (${digest}) has no valid signature from ${identity}, skipping."
          done <<< "${tags}"
          if [ -z "${latest}" ]; then
            echo "No tag has a published image, nothing to rescan."
            echo "found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          base="${latest%-xs.*}"
          # Next n is one more than the highest n of ALL tags of this version, published or not.
          max_n="$(git tag --list "${base}-xs.*" | sed -n 's/.*-xs\.\([0-9][0-9]*\)$/\1/p' | sort -n | tail -n 1)"
          {
            echo "found=true"
            echo "tag=${latest}"
            echo "digest=${digest}"
            echo "version=${latest#v}"
            echo "commit=$(git rev-list -n 1 "refs/tags/${latest}")"
            echo "next_tag=${base}-xs.$((max_n + 1))"
            echo "next_version=${base#v}-xs.$((max_n + 1))"
          } >> "${GITHUB_OUTPUT}"
      - name: Scan the published image (amd64 and arm64)
        id: scan
        if: steps.latest.outputs.found == 'true'
        env:
          DIGEST: ${{ steps.latest.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_DISABLE_VEX_NOTICE: 'true'
        run: |
          set -euo pipefail
          export LC_ALL=C
          : > "${RUNNER_TEMP}/published.ids"
          for arch in amd64 arm64; do
            trivy image --quiet --platform "linux/${arch}" --ignore-unfixed --severity HIGH,CRITICAL \
              --format json --output "${RUNNER_TEMP}/published-${arch}.json" --exit-code 0 "${GHCR_REPO}@${DIGEST}"
            jq -r --arg a "${arch}" '[.Results[]? | .Vulnerabilities[]? | "\($a) \(.VulnerabilityID) \(.PkgName)"] | unique | .[]' \
              "${RUNNER_TEMP}/published-${arch}.json" >> "${RUNNER_TEMP}/published.ids"
          done
          sort -u -o "${RUNNER_TEMP}/published.ids" "${RUNNER_TEMP}/published.ids"
          count="$(wc -l < "${RUNNER_TEMP}/published.ids")"
          echo "Fixable HIGH/CRITICAL findings in the published image: ${count}"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
      - name: Build a candidate from the same commit (both arches, not pushed)
        if: steps.latest.outputs.found == 'true' && steps.scan.outputs.count != '0'
        env:
          COMMIT: ${{ steps.latest.outputs.commit }}
          NEXT_VERSION: ${{ steps.latest.outputs.next_version }}
        run: |
          set -euo pipefail
          git checkout -q --detach "${COMMIT}"
          build_image="$(make print-build-image)"
          for arch in amd64 arm64; do
            # Same recipe as xs-release.yml: upstream's make target in upstream's build image.
            docker run --rm -v "${PWD}:/go/src/github.com/grafana/mimir" -w /go/src/github.com/grafana/mimir \
              --entrypoint sh "${build_image}" -c \
              "git config --global --add safe.directory '*' && make BUILD_IN_CONTAINER=false VERSION=${NEXT_VERSION} GOOS=linux GOARCH=${arch} BINARY_SUFFIX=_linux_${arch} cmd/mimir/mimir"
            docker buildx build -o "type=oci,dest=${RUNNER_TEMP}/candidate-${arch}.tar" \
              --platform "linux/${arch}" --provenance=false --sbom=false \
              --build-arg=revision="$(git rev-parse --short HEAD)" \
              --build-arg=USE_BINARY_SUFFIX=true cmd/mimir/
            mkdir "${RUNNER_TEMP}/candidate-${arch}"
            tar -xf "${RUNNER_TEMP}/candidate-${arch}.tar" -C "${RUNNER_TEMP}/candidate-${arch}"
          done
      - name: Compare the candidate with the published image
        id: compare
        if: steps.latest.outputs.found == 'true' && steps.scan.outputs.count != '0'
        env:
          TRIVY_DISABLE_VEX_NOTICE: 'true'
        run: |
          set -euo pipefail
          export LC_ALL=C
          : > "${RUNNER_TEMP}/candidate.ids"
          for arch in amd64 arm64; do
            trivy image --quiet --input "${RUNNER_TEMP}/candidate-${arch}" --ignore-unfixed --severity HIGH,CRITICAL \
              --format json --output "${RUNNER_TEMP}/candidate-${arch}.json" --exit-code 0
            jq -r --arg a "${arch}" '[.Results[]? | .Vulnerabilities[]? | "\($a) \(.VulnerabilityID) \(.PkgName)"] | unique | .[]' \
              "${RUNNER_TEMP}/candidate-${arch}.json" >> "${RUNNER_TEMP}/candidate.ids"
          done
          sort -u -o "${RUNNER_TEMP}/candidate.ids" "${RUNNER_TEMP}/candidate.ids"
          critical="$(cat "${RUNNER_TEMP}"/candidate-*.json | jq -s '[.[] | .Results[]? | .Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length')"
          pub="$(wc -l < "${RUNNER_TEMP}/published.ids")"
          cand="$(wc -l < "${RUNNER_TEMP}/candidate.ids")"
          introduced="$(comm -13 "${RUNNER_TEMP}/published.ids" "${RUNNER_TEMP}/candidate.ids" | wc -l)"
          # A rebuild is worth cutting only when its finding set is strictly smaller.
          if [ "${critical}" -gt 0 ]; then
            # The release gate fails on fixable CRITICAL findings, so a dispatch would fail every week.
            echo "rebuild=false" >> "${GITHUB_OUTPUT}"
            {
              echo "### No rebuild cut"
              echo "The candidate still has ${critical} fixable CRITICAL findings, so the release gate would fail. These need an upstream bump:"
              echo '```'
              cat "${RUNNER_TEMP}/candidate.ids"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          elif [ "${introduced}" -eq 0 ] && [ "${cand}" -lt "${pub}" ]; then
            echo "rebuild=true" >> "${GITHUB_OUTPUT}"
            echo "Candidate fixes $((pub - cand)) of ${pub} findings."
          else
            echo "rebuild=false" >> "${GITHUB_OUTPUT}"
            {
              echo "### No rebuild cut"
              echo "A rebuild from the same commit does not reduce the fixable HIGH/CRITICAL set (published ${pub}, candidate ${cand}, new ${introduced})."
              echo "These findings need an upstream bump (Go toolchain, dependency or base image pin):"
              echo '```'
              cat "${RUNNER_TEMP}/candidate.ids"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Dispatch the release workflow
        if: steps.compare.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.latest.outputs.next_tag }}
          COMMIT: ${{ steps.latest.outputs.commit }}
        run: |
          set -euo pipefail
          gh workflow run xs-release.yml --repo "${GITHUB_REPOSITORY}" --ref main -f tag="${NEXT}" -f commit="${COMMIT}"
          echo "Dispatched xs-release for ${NEXT} at ${COMMIT}." >> "${GITHUB_STEP_SUMMARY}"
