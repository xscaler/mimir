# Delete rehearsal package versions older than 14 days. Rehearsal runs (pushes to ci/**) publish to
# ghcr.io/xscaler/rehearsal/* and ghcr.io/xscaler/rehearsal/charts/*, which only exist to prove the
# publish path before merge.
name: xs-rehearsal-cleanup

on:
  schedule:
    - cron: '23 3 * * 2'
  workflow_dispatch:
    inputs:
      allow-missing-packages:
        description: 'Treat a missing package as nothing to clean (only for the first run, before any rehearsal published)'
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: xs-rehearsal-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ALLOW_MISSING: ${{ inputs.allow-missing-packages && 'true' || 'false' }}
    steps:
      - name: Delete rehearsal package versions older than 14 days
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          for pkg in rehearsal%2Fmimir rehearsal%2Fcharts%2Fmimir-distributed; do
            rc=0
            out="$(gh api --paginate "orgs/xscaler/packages/container/${pkg}/versions?per_page=100" --jq '.[] | "\(.id) \(.created_at)"' 2>&1)" || rc=$?
            if [ "${rc}" -ne 0 ]; then
              if printf '%s' "${out}" | grep -q 'HTTP 404'; then
                if [ "${ALLOW_MISSING}" = "true" ]; then
                  echo "${pkg}: package does not exist yet, nothing to clean (allowed for this run)."
                  continue
                fi
                echo "::error::${pkg}: the packages API answered 404. Rehearsal packages should exist; if this is the first run before any rehearsal, dispatch with allow-missing-packages."
                exit 1
              fi
              printf '%s\n' "${out}" >&2
              exit 1
            fi
            deleted=0
            while read -r id created; do
              [ -n "${id}" ] || continue
              # ISO 8601 timestamps in UTC compare correctly as strings.
              if [[ "${created}" < "${cutoff}" ]]; then
                # One version failing to delete must not stop the rest.
                if gh api -X DELETE "orgs/xscaler/packages/container/${pkg}/versions/${id}" > /dev/null; then
                  deleted=$((deleted + 1))
                else
                  echo "::warning::could not delete ${pkg} version ${id}, continuing"
                fi
              fi
            done <<< "${out}"
            echo "${pkg}: deleted ${deleted} versions older than ${cutoff}."
          done
