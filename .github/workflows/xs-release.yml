# Build, scan, sign and publish the xScaler Mimir image to GHCR.
#
# Modes, chosen in the prepare job:
#   release    tag push v<version>-xs.<n>, or workflow_dispatch on main with a tag (and a commit
#              when the tag does not exist yet). Publishes ghcr.io/xscaler/mimir:<version> and
#              creates the git tag after the image is verified. The commit must be an ancestor of main.
#   rehearsal  push to ci/**. Runs the same publish path against
#              ghcr.io/xscaler/rehearsal/mimir:<shortsha>. Never touches ghcr.io/xscaler/mimir.
#   verify     push to main and pull requests. Builds both arches and scans, pushes nothing.
#
# The binaries are built with upstream's make target inside upstream's build image. The per-arch
# images are built from upstream's cmd/mimir/Dockerfile with the buildx arguments of the
# push-multiarch-cmd/mimir/.uptodate make target. Production pulls through an ECR pull-through
# cache of GHCR, so nothing is pushed to ECR.
name: xs-release

on:
  push:
    branches:
      - main
      - 'ci/**'
    tags:
      - 'v*-xs.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v3.2.3-xs.1'
        required: true
        type: string
      commit:
        description: 'Commit to release, required when the tag does not exist yet'
        required: false
        type: string

permissions: {}

concurrency:
  group: xs-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    # Same-repo PRs are already covered by the push trigger on their branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.meta.outputs.mode }}
      commit: ${{ steps.meta.outputs.commit }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      image_repo: ${{ steps.meta.outputs.image_repo }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      identity: ${{ steps.meta.outputs.identity }}
      build_image: ${{ steps.meta.outputs.build_image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_COMMIT: ${{ inputs.commit }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          IMAGE_ROOT: ghcr.io/xscaler
        run: |
          set -euo pipefail
          nl=$'\n'
          for v in "${INPUT_TAG}" "${INPUT_COMMIT}" "${REF_NAME}"; do
            if [[ "${v}" == *"${nl}"* ]]; then
              echo "::error::input contains a newline"
              exit 1
            fi
          done
          tag_re='^v[0-9]+\.[0-9]+\.[0-9]+-xs\.(0|[1-9][0-9]*)$'
          sha_re='^[0-9a-f]{40}$'
          mode=verify
          tag=""
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${REF}" != "refs/heads/main" ]]; then
              echo "::error::release dispatches must run on main"
              exit 1
            fi
            mode=release
            tag="${INPUT_TAG}"
          elif [[ "${EVENT_NAME}" == "push" && "${REF_TYPE}" == "tag" ]]; then
            mode=release
            tag="${REF_NAME}"
          elif [[ "${EVENT_NAME}" == "push" && "${REF}" == refs/heads/ci/* ]]; then
            mode=rehearsal
          fi

          upstream_version="$(cat VERSION)"
          commit="${WORKFLOW_SHA}"
          version="${upstream_version}-xs.0"
          image_repo="${IMAGE_ROOT}/mimir"
          image_tag="${version}"

          if [[ "${mode}" == "release" ]]; then
            if [[ ! "${tag}" =~ ${tag_re} ]]; then
              echo "::error::tag does not match v<upstream-version>-xs.<n>"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/${tag}^{commit}" > /dev/null; then
              commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
              if [[ -n "${INPUT_COMMIT}" && "${INPUT_COMMIT}" != "${commit}" ]]; then
                echo "::error::tag ${tag} exists at a different commit than the commit input"
                exit 1
              fi
            else
              if [[ ! "${INPUT_COMMIT}" =~ ${sha_re} ]]; then
                echo "::error::tag ${tag} does not exist, a full 40 character commit input is required"
                exit 1
              fi
              git cat-file -e "${INPUT_COMMIT}^{commit}"
              commit="${INPUT_COMMIT}"
            fi
            # A release must come from main.
            if ! git merge-base --is-ancestor "${commit}" refs/remotes/origin/main; then
              echo "::error::commit ${commit} is not an ancestor of origin/main"
              exit 1
            fi
            version="${tag#v}"
            commit_version="$(git show "${commit}:VERSION")"
            if [[ "${version%-xs.*}" != "${commit_version}" ]]; then
              echo "::error::tag version ${version} does not match VERSION ${commit_version} at the commit"
              exit 1
            fi
            image_tag="${version}"
          elif [[ "${mode}" == "rehearsal" ]]; then
            short="$(git rev-parse --short=12 "${WORKFLOW_SHA}")"
            version="${upstream_version}-xs.0-rehearsal.${short}"
            image_repo="${IMAGE_ROOT}/rehearsal/mimir"
            image_tag="${short}"
          fi

          git checkout -q --detach "${commit}"
          build_image="$(make print-build-image)"
          {
            echo "mode=${mode}"
            echo "commit=${commit}"
            echo "tag=${tag}"
            echo "version=${version}"
            echo "image_repo=${image_repo}"
            echo "image_tag=${image_tag}"
            echo "identity=https://github.com/${WORKFLOW_REF}"
            echo "build_image=${build_image}"
          } >> "${GITHUB_OUTPUT}"

  binaries:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    container:
      image: ${{ needs.prepare.outputs.build_image }} # zizmor: ignore[unpinned-images] The image output produced by the prepare step is pinned
    steps:
      - name: Check out the source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Run Git Config
        run: git config --global --add safe.directory '*'
      - name: Symlink Expected Path to Workspace
        run: |
          mkdir -p /go/src/github.com/grafana/mimir
          ln -s "$GITHUB_WORKSPACE"/* /go/src/github.com/grafana/mimir
      - name: Build mimir binary
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # Same recipe as push-multiarch-cmd/mimir/.uptodate. VERSION feeds the
          # upstream ldflags (pkg/util/version.Version).
          make BUILD_IN_CONTAINER=false VERSION="${VERSION}" GOOS=linux GOARCH="${ARCH}" \
            BINARY_SUFFIX="_linux_${ARCH}" cmd/mimir/mimir
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mimir-linux-${{ matrix.arch }}
          path: cmd/mimir/mimir_linux_${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  image:
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Check out CI scripts from the workflow commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: xs-ci
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mimir-linux-*
          path: cmd/mimir
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.38.1
          cache-binary: false
      - name: Build one image per architecture
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          IMAGE_REF: ${{ needs.prepare.outputs.image_repo }}:${{ needs.prepare.outputs.image_tag }}
        run: |
          set -euo pipefail
          chmod +x cmd/mimir/mimir_linux_*
          for arch in amd64 arm64; do
            # Same arguments as push-multiarch-cmd/mimir/.uptodate, one platform at a time so each
            # platform image has its own digest. The Dockerfile only copies the prebuilt binary,
            # so no emulation is needed. The xScaler OCI labels override the Dockerfile's own.
            docker buildx build \
              -o "type=oci,dest=${RUNNER_TEMP}/mimir-${arch}.tar" \
              --platform "linux/${arch}" \
              --provenance=false --sbom=false \
              --build-arg=revision="$(git rev-parse --short "${COMMIT}")" \
              --build-arg=USE_BINARY_SUFFIX=true \
              --label org.opencontainers.image.source=https://github.com/xscaler/mimir \
              --label org.opencontainers.image.licenses=AGPL-3.0-only \
              --label org.opencontainers.image.version="${VERSION}" \
              --label org.opencontainers.image.revision="${COMMIT}" \
              -t "${IMAGE_REF}" cmd/mimir/
            mkdir "${RUNNER_TEMP}/layout-${arch}"
            tar -xf "${RUNNER_TEMP}/mimir-${arch}.tar" -C "${RUNNER_TEMP}/layout-${arch}"
          done
      - name: Install Trivy
        run: |
          set -euo pipefail
          . xs-ci/.github/scripts/xs-lib.sh
          xs_install_trivy
      - name: Trivy scan (report and SARIF)
        env:
          TRIVY_DISABLE_VEX_NOTICE: 'true'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/sarif"
          for arch in amd64 arm64; do
            trivy image --input "${RUNNER_TEMP}/layout-${arch}" \
              --severity HIGH,CRITICAL --ignore-unfixed --format sarif \
              --output "${RUNNER_TEMP}/sarif/trivy-${arch}.sarif" --exit-code 0
            trivy image --input "${RUNNER_TEMP}/layout-${arch}" \
              --severity HIGH,CRITICAL --format table --exit-code 0
          done
      - name: Upload SARIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-sarif
          path: ${{ runner.temp }}/sarif
          retention-days: 1
      - name: Trivy gate (fixable CRITICAL fails the build)
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            trivy image --input "${RUNNER_TEMP}/layout-${arch}" \
              --severity CRITICAL --ignore-unfixed --exit-code 1
          done
      - name: Upload OCI archives
        if: needs.prepare.outputs.mode != 'verify'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mimir-oci
          path: |
            ${{ runner.temp }}/mimir-amd64.tar
            ${{ runner.temp }}/mimir-arm64.tar
          retention-days: 1
          if-no-files-found: error

  sarif:
    # Separate job so the code that builds the image never holds security-events: write, and
    # pull requests never upload.
    needs: [prepare, image]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trivy-sarif
          path: sarif
      - name: Upload SARIF (amd64)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif/trivy-amd64.sarif
          category: trivy-mimir-amd64
      - name: Upload SARIF (arm64)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif/trivy-arm64.sarif
          category: trivy-mimir-arm64

  publish:
    needs: [prepare, image]
    if: needs.prepare.outputs.mode == 'release' || needs.prepare.outputs.mode == 'rehearsal'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ needs.prepare.outputs.mode == 'release' && 'release' || 'rehearsal' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE_REPO: ${{ needs.prepare.outputs.image_repo }}
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
      IDENTITY: ${{ needs.prepare.outputs.identity }}
    outputs:
      digest: ${{ steps.index.outputs.digest }}
      amd64_digest: ${{ steps.index.outputs.amd64_digest }}
      arm64_digest: ${{ steps.index.outputs.arm64_digest }}
    steps:
      - name: Check out CI scripts from the workflow commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Download OCI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mimir-oci
          path: ${{ runner.temp }}
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install crane, cosign and syft
        run: |
          set -euo pipefail
          . .github/scripts/xs-lib.sh
          xs_install_crane
          xs_install_cosign
          xs_install_syft
      - name: Push the platform images and create the index
        id: index
        run: |
          set -euo pipefail
          . .github/scripts/xs-lib.sh
          rc=0
          existing="$(xs_digest "${IMAGE_REPO}:${IMAGE_TAG}")" || rc=$?
          case "${rc}" in
            0)
              echo "${IMAGE_REPO}:${IMAGE_TAG} already exists at ${existing}, resuming with it."
              index="${existing}"
              ;;
            1)
              for arch in amd64 arm64; do
                mkdir "${RUNNER_TEMP}/layout-${arch}"
                tar -xf "${RUNNER_TEMP}/mimir-${arch}.tar" -C "${RUNNER_TEMP}/layout-${arch}"
                d="$(jq -r '.manifests[0].digest' "${RUNNER_TEMP}/layout-${arch}/index.json")"
                # Push by digest: no per-arch tags.
                crane push "${RUNNER_TEMP}/layout-${arch}" "${IMAGE_REPO}@${d}"
                got="$(xs_digest "${IMAGE_REPO}@${d}")"
                [ "${got}" = "${d}" ]
                echo "${arch}=${d}" >> "${RUNNER_TEMP}/arch-digests"
              done
              amd64="$(sed -n 's/^amd64=//p' "${RUNNER_TEMP}/arch-digests")"
              arm64="$(sed -n 's/^arm64=//p' "${RUNNER_TEMP}/arch-digests")"
              # Re-check right before creating the index: the tag must still be absent.
              rc2=0
              xs_digest "${IMAGE_REPO}:${IMAGE_TAG}" > /dev/null || rc2=$?
              if [ "${rc2}" -ne 1 ]; then
                echo "::error::${IMAGE_REPO}:${IMAGE_TAG} appeared while publishing, refusing to overwrite it"
                exit 1
              fi
              docker buildx imagetools create --metadata-file "${RUNNER_TEMP}/index-metadata.json" \
                -t "${IMAGE_REPO}:${IMAGE_TAG}" "${IMAGE_REPO}@${amd64}" "${IMAGE_REPO}@${arm64}"
              index="$(jq -r '.["containerimage.descriptor"].digest' "${RUNNER_TEMP}/index-metadata.json")"
              [[ "${index}" =~ ^sha256:[0-9a-f]{64}$ ]]
              ;;
            *)
              exit 1
              ;;
          esac
          # Platform digests come from the index itself, so a resumed run uses the real ones.
          amd64="$(crane manifest "${IMAGE_REPO}@${index}" | jq -r '.manifests[] | select(.platform.architecture=="amd64") | .digest')"
          arm64="$(crane manifest "${IMAGE_REPO}@${index}" | jq -r '.manifests[] | select(.platform.architecture=="arm64") | .digest')"
          {
            echo "digest=${index}"
            echo "amd64_digest=${amd64}"
            echo "arm64_digest=${arm64}"
          } >> "${GITHUB_OUTPUT}"
      - name: Generate SBOMs (SPDX JSON, one per platform image)
        env:
          AMD64: ${{ steps.index.outputs.amd64_digest }}
          ARM64: ${{ steps.index.outputs.arm64_digest }}
        run: |
          set -euo pipefail
          syft "${IMAGE_REPO}@${AMD64}" -o "spdx-json=${RUNNER_TEMP}/sbom-amd64.spdx.json"
          syft "${IMAGE_REPO}@${ARM64}" -o "spdx-json=${RUNNER_TEMP}/sbom-arm64.spdx.json"
      - name: Attest SBOM (amd64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.index.outputs.amd64_digest }}
          sbom-path: ${{ runner.temp }}/sbom-amd64.spdx.json
          push-to-registry: true
      - name: Attest SBOM (arm64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.index.outputs.arm64_digest }}
          sbom-path: ${{ runner.temp }}/sbom-arm64.spdx.json
          push-to-registry: true
      - name: Attest build provenance (index)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - name: Sign the index and the platform manifests
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          . .github/scripts/xs-lib.sh
          xs_ensure_signed "${IMAGE_REPO}@${DIGEST}" "${IDENTITY}" --recursive

  verify:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      IMAGE_REPO: ${{ needs.prepare.outputs.image_repo }}
      IDENTITY: ${{ needs.prepare.outputs.identity }}
      VERSION: ${{ needs.prepare.outputs.version }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      AMD64: ${{ needs.publish.outputs.amd64_digest }}
      ARM64: ${{ needs.publish.outputs.arm64_digest }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out CI scripts from the workflow commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        run: |
          set -euo pipefail
          . .github/scripts/xs-lib.sh
          xs_install_cosign
      - name: Verify the cosign signature
        run: |
          set -euo pipefail
          . .github/scripts/xs-lib.sh
          cosign verify --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${XS_OIDC_ISSUER}" "${IMAGE_REPO}@${DIGEST}" > /dev/null
          echo "cosign verify ok: ${IMAGE_REPO}@${DIGEST}"
      - name: Verify provenance and per-platform SBOM attestations
        run: |
          set -euo pipefail
          signer=xscaler/mimir/.github/workflows/xs-release.yml
          gh attestation verify "oci://${IMAGE_REPO}@${DIGEST}" --repo xscaler/mimir --signer-workflow "${signer}"
          for d in "${AMD64}" "${ARM64}"; do
            gh attestation verify "oci://${IMAGE_REPO}@${d}" --repo xscaler/mimir --signer-workflow "${signer}" \
              --predicate-type https://spdx.dev/Document/v2.3
          done
      - name: Run the image and check the version
        run: |
          set -euo pipefail
          out="$(docker run --rm --platform linux/amd64 "${IMAGE_REPO}@${DIGEST}" -version)"
          echo "${out}"
          if [[ "${out}" != *"version ${VERSION} "* ]]; then
            echo "::error::the image reports a version other than ${VERSION}"
            exit 1
          fi
      - name: Summary
        run: |
          {
            echo "### mimir ${VERSION}"
            echo "- ${IMAGE_REPO}@${DIGEST}"
            echo "- amd64 ${AMD64}"
            echo "- arm64 ${ARM64}"
          } >> "${GITHUB_STEP_SUMMARY}"

  tag:
    # The git tag is created only after the image is published and verified.
    needs: [prepare, verify]
    if: needs.prepare.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create the tag if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          if existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha 2> /dev/null)"; then
            echo "tag ${TAG} already exists (${existing})."
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${COMMIT}"
